openapi: 3.0.3
info:
  title: Gear Signal API
  version: 0.1.0

paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Server and database are healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: A dependency is unhealthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /depots:
    get:
      operationId: listDepots
      responses:
        "200":
          description: All depots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Depot" }

  /routes:
    get:
      operationId: listRoutes
      responses:
        "200":
          description: All routes, including their street geometry
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Route" }

  /vehicles:
    get:
      operationId: listVehicles
      responses:
        "200":
          description: All vehicles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Vehicle" }

  /vehicles/available:
    get:
      operationId: listAvailable
      description: >
        Where each vehicle's next trip must start and the earliest start POST /trips accepts,
        computed with the same rules as trip creation (worst-case reserved time).
      responses:
        "200":
          description: One entry per vehicle
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Availability" }

  /trips:
    get:
      operationId: listTrips
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/TripStatus" }
      responses:
        "200":
          description: Trips ordered by scheduled start, optionally filtered by status
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Trip" }
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: createTrip
      description: >
        Schedules a trip after the vehicle's last scheduled or active trip. The route must
        start where the vehicle will be by then, and the start must not overlap the earlier
        trip's reserved time (its worst-case duration).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewTrip" }
      responses:
        "201":
          description: The scheduled trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "404":
          description: Vehicle or route not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Overlaps the vehicle's other trips
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Start not in the future, wrong origin depot, or vehicle in maintenance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /trips/{id}:
    patch:
      operationId: updateTrip
      description: >
        Cancels a scheduled trip. Only the last trip of a vehicle's chain can be cancelled,
        because later trips start where it ends.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripPatch" }
      responses:
        "200":
          description: The cancelled trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "404":
          description: Trip not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Trip is not scheduled, or a later trip depends on it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Unsupported status change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  schemas:
    Health:
      type: object
      required: [status, db]
      properties:
        status: { type: string }
        db: { type: string }

    Depot:
      type: object
      required: [id, name, lat, lon]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: DTLA Warehouse }
        lat: { type: number, format: double }
        lon: { type: number, format: double }

    Route:
      type: object
      required:
        [
          id,
          name,
          originDepotId,
          destinationDepotId,
          distance,
          duration,
          coordinates,
        ]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: dtla-lax }
        originDepotId: { type: integer, format: int64 }
        destinationDepotId: { type: integer, format: int64 }
        distance:
          {
            type: number,
            format: double,
            description: Meters along the stored polyline,
          }
        duration:
          { type: integer, description: Seconds at free-flow speed (OSRM) }
        coordinates:
          description: Street-following polyline as [lng, lat] pairs
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number, format: double }
            x-go-type: "[2]float64"

    VehicleType:
      type: string
      enum: [ev_van, diesel_truck]

    VehicleStatus:
      type: string
      enum: [idle, en_route, charging, maintenance]

    Vehicle:
      type: object
      required: [id, name, plate, type, status, depotId]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: VAN-07 }
        plate: { type: string, example: 8GSV123 }
        type: { $ref: "#/components/schemas/VehicleType" }
        status: { $ref: "#/components/schemas/VehicleStatus" }
        depotId:
          description: Depot where the vehicle is currently parked; changes when a trip completes.
          type: integer
          format: int64

    Availability:
      type: object
      required: [vehicleId, depotId, availableAt]
      properties:
        vehicleId: { type: integer, format: int64 }
        depotId:
          description: Depot where the vehicle will be after its planned trips; a new trip's route must leave it.
          type: integer
          format: int64
        availableAt:
          description: >
            Earliest start for a new trip: now, or when the vehicle's last planned trip can be done.
            The start must also be strictly after the request time.
          type: string
          format: date-time

    TripStatus:
      type: string
      enum: [scheduled, active, completed, cancelled]

    Trip:
      type: object
      required: [id, vehicleId, routeId, scheduledStart, status]
      properties:
        id: { type: integer, format: int64 }
        vehicleId: { type: integer, format: int64 }
        routeId: { type: integer, format: int64 }
        scheduledStart: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        eta: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/TripStatus" }

    NewTrip:
      type: object
      required: [vehicleId, routeId, scheduledStart]
      properties:
        vehicleId: { type: integer, format: int64 }
        routeId: { type: integer, format: int64 }
        scheduledStart: { type: string, format: date-time }

    TripPatch:
      type: object
      required: [status]
      properties:
        status:
          description: The only supported change is scheduled -> cancelled.
          type: string
          enum: [cancelled]

    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
