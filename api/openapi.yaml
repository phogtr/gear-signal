openapi: 3.0.3
info:
  title: Gear Signal API
  version: 0.1.0

paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Server and database are healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: A dependency is unhealthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /depots:
    get:
      operationId: listDepots
      responses:
        "200":
          description: All depots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Depot" }

  /routes:
    get:
      operationId: listRoutes
      responses:
        "200":
          description: All routes, including their street geometry
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Route" }

  /vehicles:
    get:
      operationId: listVehicles
      responses:
        "200":
          description: All vehicles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Vehicle" }

  /trips:
    get:
      operationId: listTrips
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/TripStatus" }
      responses:
        "200":
          description: Trips ordered by scheduled start, optionally filtered by status
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Trip" }
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  schemas:
    Health:
      type: object
      required: [status, db]
      properties:
        status: { type: string }
        db: { type: string }

    Depot:
      type: object
      required: [id, name, lat, lon]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: DTLA Warehouse }
        lat: { type: number, format: double }
        lon: { type: number, format: double }

    Route:
      type: object
      required: [id, name, distanceMeters, durationSeconds, coordinates]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: dtla-lax }
        distanceMeters: { type: number, format: double }
        durationSeconds: { type: integer }
        coordinates:
          description: Street-following polyline as [lng, lat] pairs
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number, format: double }
            x-go-type: "[2]float64"

    VehicleType:
      type: string
      enum: [ev_van, diesel_truck]

    VehicleStatus:
      type: string
      enum: [idle, en_route, charging, maintenance]

    Vehicle:
      type: object
      required: [id, name, plate, type, status, depotId]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: VAN-07 }
        plate: { type: string, example: 8GSV123 }
        type: { $ref: "#/components/schemas/VehicleType" }
        status: { $ref: "#/components/schemas/VehicleStatus" }
        depotId: { type: integer, format: int64 }

    TripStatus:
      type: string
      enum: [scheduled, active, completed, cancelled]

    Trip:
      type: object
      required: [id, vehicleId, routeId, scheduledStart, status]
      properties:
        id: { type: integer, format: int64 }
        vehicleId: { type: integer, format: int64 }
        routeId: { type: integer, format: int64 }
        scheduledStart: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        eta: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/TripStatus" }

    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
